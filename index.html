    .top-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 5px 24px;
        min-height: 44px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }
    .nav-left {
        grid-column: 1;
    }
    .nav-title {
        grid-column: 2;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .nav-title h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: 0.2px;
        text-align: center;
    }
    .nav-title p {
        margin: 1px 0 0;
        font-size: 11px;
        line-height: 1.2;
        opacity: 0.85;
        text-align: center;
    }
    .nav-controls {
        grid-column: 3;
        justify-self: end;
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .tool-btn {
        height: 28px;
        min-width: 28px;
        padding: 0 8px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
    }
    .fit-btn, .print-btn { padding: 0 10px; font-size: 11.5px; }
    .v-line { width: 1px; height: 16px; margin: 0 3px; }
    .zoom-text { font-size: 12px; font-weight: 600; min-width: 44px; text-align: center; }

    .tree-scroll-wrapper {
        width: 100%;
        max-width: 1700px;
        margin: 0 auto;
        overflow: auto;
        padding: 10px 5px 30px;
        display: flex;
        justify-content: center;
    }
    .tree-container {
        display: block;
        margin: 0 auto;
        transform-origin: top center;
        transition: transform 0.2s ease;
        height: auto !important;
    }
    rect { stroke-width: 2.5; rx: 8; ry: 8; }
    text { font-weight: 600; font-size: 14px; user-select: none; }
    text.root-text { font-size: 13px; font-weight: 700; }
    text.compact-text { font-size: 11px; font-weight: 700; }
    line { stroke-width: 2.5; }

    @media print {

        .tree-scroll-wrapper { overflow: visible !important; }
        .tree-container { transform: none !important; box-shadow: none !important; }
    }

    <script>
        let currentZoom = 1.0;
        const svgElement = document.getElementById('familySvg');
        const zoomDisplay = document.getElementById('zoomLevel');
        const scrollWrapper = document.getElementById('scrollWrapper');

        function applyZoom() {
            svgElement.style.transform = `scale(${currentZoom})`;
            zoomDisplay.textContent = Math.round(currentZoom * 100) + '%';
        }
        function changeZoom(delta) {
            currentZoom = Math.min(2.0, Math.max(0.35, currentZoom + delta));
            applyZoom();
        }
        function resetZoom() {
            currentZoom = 1.0;
            applyZoom();
        }
        function fitWidth() {
            const availableWidth = scrollWrapper.clientWidth - 40;
            currentZoom = Math.max(0.35, Math.min(1.0, availableWidth / 1600));
            applyZoom();
        }
        window.addEventListener('DOMContentLoaded', () => {
            if (window.innerWidth < 1650) {
                fitWidth();
            }
        });
    </script>
